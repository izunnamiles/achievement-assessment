services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: achievement-app
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - .:/var/www/html
    # No env_file: .env is already bind-mounted into the container, so
    # Laravel's own Dotenv loader reads it at boot, same as on the host.
    # Exporting it as real container env vars too would make PHP's SAPI
    # pre-populate $_SERVER with it, which then silently outranks test-time
    # overrides in phpunit.xml (see phpunit.xml's <php> block for details).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: achievement-app
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    depends_on:
      - api

networks:
  app-network:
    driver: bridge
