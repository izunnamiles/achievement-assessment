services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: achievement-app
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
